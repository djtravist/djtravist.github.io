<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Creekview vs. Centennial - Varsity Game</title>

  <!-- Firebase scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      color: #333;
      padding: 2em;
      background-image: url('grizzlies_head.png');
      background-repeat: repeat;
      background-position: 0 0;
      background-size: 12vw auto;
      background-attachment: fixed;
      background-color: transparent;
    }

    .page-title {
      text-align: center;
      margin-bottom: 2em;
    }
    
    .page-title h1 {
      color: #fff;
      background-color: #000 !important;
      border: none !important;
      padding: 0.75em 1.5em;
      border-radius: 6px;
      display: inline-block;
      font-size: 2em;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
    }

    .video-wrapper {
      background-color: #000;
      color: #fff;
      display: block;
      max-width: 640px;
      margin: 2em auto;
      text-align: center;
      padding: 1em;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .video-title {
      margin-bottom: 0.5em;
      font-size: 1.2em;
      font-weight: bold;
      color: #fff;
      border: 2px solid #000;
      background-color: #111;
      padding: 0.5em 1em;
      border-radius: 6px;
      display: inline-block;
    }

    video {
      display: block;
      width: 100%;
      max-width: 640px;
      height: auto;
      border: 1px solid #ccc;
      background: #000;
      margin: 0 auto;
    }

    .video-views {
      text-align: right;
      font-size: 0.8em;
      margin-top: 0.3em;
      color: #ccc;
    }
  </style>
</head>

<body>
  <!-- Password prompt -->
  <script>
    var password = prompt("Enter password:");
    if (password !== "5080") {
      document.body.innerHTML = "<h1 style='color:red;'>Access Denied</h1>";
      throw new Error("Access Denied");
    }
  </script>

  <!-- Page title -->
  <div class="page-title">
    <h1>Creekview vs. Centennial Varsity 9/13/2025</h1>
  </div>

  <!-- Container for videos -->
  <div id="videoContainer"></div>

  <!-- Firebase script -->
  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBPJGqsH_pLXffDt6ol3SOxgC9joKUdKm4",
      authDomain: "footballvideocounter.firebaseapp.com",
      projectId: "footballvideocounter",
      storageBucket: "footballvideocounter.firebasestorage.app",
      messagingSenderId: "126776947656",
      appId: "1:126776947656:web:cf05806375edaa3c27c6fd"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const folderName = 'centennial';
    const videoPrefix = 'Centennial';
    const totalVideos = 69;

    const container = document.getElementById('videoContainer');

    for (let i = 1; i <= totalVideos; i++) {
      const padded = String(i).padStart(2, '0');
      const videoId = `${videoPrefix}_${padded}`;
      console.log("Processing video:", videoId);

      const wrapper = document.createElement('div');
      wrapper.className = 'video-wrapper';

      const title = document.createElement('div');
      title.className = 'video-title';
      title.textContent = `${videoPrefix} ${i}`;

      const video = document.createElement('video');
      video.controls = true;

      const source = document.createElement('source');
      source.src = `${folderName}/${videoId}.mp4`;
      source.type = 'video/mp4';

      video.appendChild(source);
      video.appendChild(document.createTextNode('Your browser does not support the video tag.'));

      const counter = document.createElement('div');
      counter.className = 'video-views';
      counter.textContent = `Loading views...`;

      // Fetch view count
      db.collection("videoPlays").doc(videoId).get().then((doc) => {
        if (doc.exists) {
          counter.textContent = `Views: ${doc.data().count}`;
        } else {
          counter.textContent = `Views: 0`;
        }
      }).catch((err) => {
        console.error("Error fetching view count for", videoId, err);
        counter.textContent = 'Views: N/A';
      });

      // Count only when video plays for 5+ seconds
      let playedFor5Sec = false;
      video.addEventListener('timeupdate', () => {
        if (!playedFor5Sec && video.currentTime >= 5) {
          playedFor5Sec = true;
          const ref = db.collection("videoPlays").doc(videoId);
          db.runTransaction((transaction) => {
            return transaction.get(ref).then((doc) => {
              const newCount = (doc.exists ? doc.data().count : 0) + 1;
              transaction.set(ref, { count: newCount });
              counter.textContent = `Views: ${newCount}`;
            });
          }).catch((err) => {
            console.error("Error incrementing view count for", videoId, err);
          });
        }
      });

      wrapper.appendChild(title);
      wrapper.appendChild(video);
      wrapper.appendChild(counter);
      container.appendChild(wrapper);
    }
  </script>
</body>
</html>
